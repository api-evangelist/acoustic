note: >-
  Derived from the Acoustic Content contract (136 paths, 178 operations, 294 component
  schemas) plus the identifier conventions the reference documents. Acoustic Content
  is the only Acoustic API with a machine-readable object graph: the Campaign service
  descriptions are Swagger 1.1 with flat models, and the Connect GraphQL schema is
  introspection-gated. Relationships marked `via` name the real field carrying the
  reference; where the contract expresses a link only as a free-form uid string, that
  is recorded rather than upgraded to a typed reference.
identifiers:
  scheme: uid
  format: '{classification}:{id}'
  examples:
  - content:579c2232-7398-4c8b-921d-3932bfc45d19
  - asset:448e8d63-ed15-4d59-85e5-53908a84ca93
  classifications: [content, asset]
  id_format: uuid
  note: >-
    Most operations accept either the bare {id} plus a {classification}, or the
    combined uid. Revisions are carried separately as `rev` / `currentRev` and are
    the concurrency token — a stale rev is error 20000, mismatched.revs.
