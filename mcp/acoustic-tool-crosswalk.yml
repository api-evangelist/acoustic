method: derived
source: mcp/acoustic-mcp.yml + openapi/ + probed GraphQL endpoint
note: >-
  Emitted because Acoustic has both a GraphQL surface (Acoustic Connect) and OpenAPI
  (Acoustic Content), but the finding this crosswalk records is a DISJOINT estate,
  not an overlap. Acoustic's surfaces are not three projections of one data core —
  they are three separate products with separate data, separate hosts, separate
  credentials and no shared identifier. There is no contact in the Content API and no
  content item in the Connect API. crosswalk[] is therefore empty by fact rather than
  by omission, and that is the useful result: an agent cannot move between Acoustic's
  APIs, it has to be told which product it is talking to and hold a different
  credential for each.
