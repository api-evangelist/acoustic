    Contact creation exists only in Connect's GraphQL API. No Acoustic REST contract
    exposes a contact-create operation — the Campaign REST surface stops at contact
    databases and relational tables, and the XML API (AddRecipient) is not described
    by any machine-readable contract.
  documented_at: https://developer.goacoustic.com/acoustic-connect/reference/add-a-contact
- field: updateContacts / deleteContacts
