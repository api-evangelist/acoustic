blockers:
- No MCP server on any product.
- Connect's GraphQL schema is API-key gated, so its fields cannot be enumerated without credentials.
- Zero operationIds in the Content contract, so any tool binding must be made on method+path.
- No securitySchemes in any contract, so a tool generator cannot emit auth from the spec.
