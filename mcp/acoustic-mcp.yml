other_surfaces:
  graphql:
    api: Acoustic Connect API
    endpoint: https://connect-gql-us-1.goacoustic.com/
    introspection: gated
    note: >-
      Connect's GraphQL API is the surface an agent would most want — contacts,
      consent, audiences, product catalog, signals — but its schema requires an
      X-API-Key, so no candidate tools were derived from it. Deriving them from the
      prose reference would be invention.
  campaign_rest:
    contract: openapi/acoustic-campaign-rest-swagger-index.json
    format: Swagger 1.1
    note: >-
      64 operations across 11 resources are described, but Swagger 1.1 has no
      securitySchemes and its parameter model does not carry JSON Schema, so a tool
      inputSchema derived from it would be lossy.
