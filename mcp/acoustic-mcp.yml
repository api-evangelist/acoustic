  source_operation: 'openapi/acoustic-content-openapi-original.json#GET /authoring/v1/references/outgoing/{classification}/{id}'
  auth: basic-or-api-key
- name: publish
  description: Start a publishing job and read its status.
  source_operation: 'openapi/acoustic-content-openapi-original.json#POST /publishing/v1/jobs'
