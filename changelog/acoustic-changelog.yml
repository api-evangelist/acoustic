note: >-
  Acoustic runs exactly one dated developer changelog, and it belongs to Acoustic
  Connect. /acoustic-campaign/changelog and /acoustic-content/changelog both 404,
  and Acoustic Content's "What's new" doc page returns 403 to an anonymous client, so
  the two oldest API estates have no reachable public release history. Acoustic
  Personalization publishes a "What's new" doc page and a library version-history
  page instead of a changelog feed.
