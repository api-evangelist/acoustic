name: Acoustic
description: >-
  Acoustic is a real-time behavioral marketing platform for B2C companies, delivering
  omnichannel customer engagement across email, SMS, WhatsApp, mobile push and web.
  Its developer portal at developer.goacoustic.com publishes an RFC 9727 api-catalog
  advertising six API products: Acoustic Connect (a GraphQL API for contacts,
  consent, audiences, product catalog and signals), Acoustic Campaign (a long-lived
  REST + XML API estate inherited from Silverpop, with a live Swagger service
  description per regional pod), Acoustic Content (a headless CMS / digital asset
  management REST API covering authoring, delivery, rendering, publishing and
  webhooks), Acoustic Personalization (a client-side library for real-time content
  and product recommendations), Acoustic Experience Analytics (Tealeaf) and Acoustic
  Exchange. Formerly IBM Watson Marketing, Acoustic was carved out as an independent
  martech company and is a portfolio company of Sapphire Ventures.
