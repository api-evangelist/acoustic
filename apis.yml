- name: Acoustic Personalization
  description: >-
    Real-time personalization library and APIs for delivering optimized, tailored content to each visitor
    based on behavior and contextual data, with product catalog, recommendations, zones, geolocation and
    behavioral analytics capture. Delivered as a client-side PZN library (MPA script deployment via Exchange
    Capture, or an npm package for Angular/React SPAs distributed from Acoustic's private Artifactory).
    Acoustic publishes no callable API host for Personalization: /acoustic-personalization/reference returns
    404, and the endpoints the library talks to are registered per tenant inside Exchange rather than
    documented, so baseURL is deliberately left unset rather than pointed at a docs page.
