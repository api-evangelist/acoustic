  description: >-
    Use the Content webhook service Rest APIs to work with webhook profiles. You can create, retrieve
    and update webhook profiles in a database.


    ### Webhook Timeouts and Retry policy

    Webhooks will automatically timeout (with no retry) after 5s which means that receivers should always
    perform their processing in background threads. The only situation whereby webhooks will be retried/re-sent
    is in the event of a communication error, and in this case only a single retry will occur.

    Note: Non-2xx responses from receivers are explicitly not retried
