- name: Acoustic Campaign REST API
  description: >-
    REST API for the Acoustic Campaign (formerly Silverpop Engage) marketing
    automation platform, covering contact databases, relational tables, programs,
    contact sources, channels (push, SMS, in-app, rich content), messages, web
    tracking, Universal Behaviors (events), event types, organization settings and
    GDPR job status. Acoustic serves a live, unauthenticated Swagger 1.1 service
    description from every regional pod at /restdoc, and each pod is a separate base
    host (api-campaign-us-1..6, -eu-1, -ap-2, -ap-3, -ca-1).
