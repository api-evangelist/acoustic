- aid: acoustic:acoustic-authoring-assets-api
  name: Acoustic Authoring assets API
  description: >-
    ## General

    Use the Content Asset service Rest APIs to work with assets. Assets are file types that are uploaded
    or created such as an image file, video file, or text that are used in content items. You can create,
    retrieve, update, and delete assets in a database. Managed assets are those located in the root dxdam
    directory as specified by its path and are visible on the Content UI.

    ## Content workflow (status)

    The status of a content item can be determined by the **suffix** of the ID:

    - An ID like xxxx:**draft** indicates that the item is a draft. This is the initial status of a new
    content item until it is published. A draft of a published content item will also have this suffix.

    - An ID like xxxx:***[publishing_job_id]*** - indicates that the content item has been scheduled for
    publish in the given publishing job.

    - An ID like xxxx with no suffix indicates that the content is **published** or **retired**.

    A draft can be created from published. When such a draft is published, it will override the previously
    published content.


    **Key notes:**

    - The base ID (xxxx) does not change. Only the suffix changes according to the workflow status of
    the item.

    - Where content and assets are referenced from within a content item, the 'raw' ID form, without a
    suffix, is always used. For example, when a draft content item is referenced by another draft content
    item, the reference appears as a raw ID, and thus does not change when the items are published.

    - API clients should not depend on the ID format and should not attempt to parse it. Instead, the
    ***linkedDocId*** and ***links*** properties should be used.

    - Draft item have a property ***linkedDocId***. This is the Id that the draft item will have when
    it is published.

    - Draft items that have a published version will have a ***linkedDoc*** property within the ***links***
    property. This property will not appear for drafts that do not have a published version.
  humanURL: https://developer.goacoustic.com/acoustic-content/
  baseURL: https://content-us-1.content-cms.com/api/{tenantId}
  tags:
  - Authoring assets
