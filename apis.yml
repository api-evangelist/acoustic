- name: Acoustic Campaign XML API
  description: >-
    The long-lived XML-over-HTTP API for Acoustic Campaign, inherited from Silverpop
    Engage. A single POST endpoint per regional pod accepts XML request documents for
    contact list management, recipient management, mailing and template management,
    relational tables, scheduling, reporting and data export. Authenticated with
    OAuth 2 (refresh-token grant) or the legacy jsessionid session. Acoustic
    publishes a public Postman collection for it.
  humanURL: https://developer.goacoustic.com/acoustic-campaign/reference/xml-api-overview-1
  baseURL: https://api-campaign-us-1.goacoustic.com/XMLAPI
  properties:
  - type: Documentation
    url: https://developer.goacoustic.com/acoustic-campaign/reference/xml-api-overview-1
  - type: Postman
    url: https://documenter.getpostman.com/view/1643559/2sBXqQEHNz
  - type: Authentication
    url: authentication/acoustic-authentication.yml
- name: Acoustic Connect API
  description: >-
    The GraphQL API for Acoustic Connect — the platform's contact, consent, audience,
    reference-set, product-catalog, product-performance and signal surface. A single
    POST endpoint at the region host root, authenticated with an X-API-Key header
    generated in Connect under Administration > General settings > API keys. Three
    regional endpoints (us-east-1, ap-southeast-2, eu-central-1). Schema
    introspection is authentication-gated.
  humanURL: https://developer.goacoustic.com/acoustic-connect/reference/introduction
  baseURL: https://connect-gql-us-1.goacoustic.com/
  properties:
  - type: Documentation
    url: https://developer.goacoustic.com/acoustic-connect/reference/introduction
  - type: GettingStarted
    url: https://developer.goacoustic.com/acoustic-connect/reference/use-connect-api
  - type: ChangeLog
    url: https://developer.goacoustic.com/acoustic-connect/changelog
  - type: Authentication
    url: authentication/acoustic-authentication.yml
- name: Acoustic Personalization
  description: >-
    Real-time personalization library and APIs for delivering optimized, tailored
    content to each visitor based on behavior and contextual data, with product
    catalog, recommendations, zones, geolocation and behavioral analytics capture.
    Delivered as a client-side PZN library (MPA script deployment via Exchange
    Capture, or an npm package for Angular/React SPAs distributed from Acoustic's
    private Artifactory). Acoustic publishes no callable API host for Personalization:
    /acoustic-personalization/reference returns 404, and the endpoints the library
    talks to are registered per tenant inside Exchange rather than documented, so
    baseURL is deliberately left unset rather than pointed at a docs page.
  humanURL: https://developer.goacoustic.com/acoustic-personalization/
  x-baseURL-status: no-usable-base
  x-baseURL-note: >-
    Checked 2026-08-13. https://developer.goacoustic.com/acoustic-personalization/reference
    returns HTTP 404; the docs describe a browser library and Exchange-registered
    endpoints, never a public API host.
  properties:
  - type: Documentation
    url: https://developer.goacoustic.com/acoustic-personalization/docs
  - type: GettingStarted
    url: https://developer.goacoustic.com/acoustic-personalization/docs/quick-start-guide-for-personalization
  - type: Components
    url: components/acoustic-components.yml
