name: Acoustic
description: >-
  Acoustic is a real-time behavioral marketing platform for B2C companies, delivering
  omnichannel customer engagement across email, SMS, WhatsApp, and mobile push. Its
  flagship product, Acoustic Connect, turns customer behavior and intent into timely,
  relevant messages through real-time orchestration and audience segmentation.
  Acoustic's developer surface at developer.goacoustic.com documents the Acoustic
  Content headless CMS / digital asset management REST API and the Acoustic
  Personalization library for delivering tailored content to each visitor in real
  time. Formerly IBM Watson Marketing, Acoustic was carved out as an independent
  martech company and is a portfolio company of Sapphire Ventures.
