    Layouts define the template for the type documents. They define the markup and how to add content
    properties and elements into the markup. For example, the layouts 'Article', and 'Event' would define
    what an article or event looks like on the web site, or email.


    Layout Mappings define an association between a content-type and one or more layouts. Specifically
