x-enrichment:
  date: '2026-08-13'
  status: enriched
  artifacts_added: 39
  pass: local-v1
  note: >-
    Contract discovery beat a JS-rendered docs host twice. The full Acoustic Content
    OpenAPI 3.0.0 (136 paths / 178 operations / 294 schemas) was extracted from the
    ReadMe-embedded API definition at /branches/1.0/apis/acoustic-content-api.json on
    developer.goacoustic.com, and a first-party Swagger 2.0 copy (142 paths / 187
    operations) was found at
    github.com/acoustic-content-samples/wch-openapi-documentation. Acoustic Campaign
    turned out to serve a live, unauthenticated Swagger 1.1 service description from
    every regional pod at /restdoc (11 resources, 64 operations), and Acoustic Connect
    is a GraphQL API whose endpoint is the region host root with introspection gated
    behind X-API-Key. The developer portal also serves a real RFC 9727
    /.well-known/api-catalog advertising six API products, four more than this profile
    previously knew about.

