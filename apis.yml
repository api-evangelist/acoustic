apis:
- name: Acoustic Content API
  description: >-
    Headless CMS and digital asset management REST API (authoring and delivery) for
    managing assets, resources, renditions, content items, content types, element
    definitions, categories/taxonomies, layouts, layout mappings, libraries, sites,
    pages, comments, reviews, versions, search, rendering, publishing jobs and the
    tenant webhook profile. Multi-tenant SaaS: the REST base host is regional and the
    path carries the tenant's Content Hub ID, so the base is
    https://{DomainName}/api/{ContentHubId} (for example
    https://content-us-1.content-cms.com/api/{tenantId}).
  humanURL: https://developer.goacoustic.com/acoustic-content/
  baseURL: https://content-us-1.content-cms.com/api/{tenantId}
