note: >-
  Acoustic runs a full Atlassian Statuspage with a public JSON API and 178 tracked
  components — the strongest operational-transparency signal in this profile. What it
  does not run is a deprecation policy: no Sunset/Deprecation header support, no
  version-retirement schedule and no API lifecycle page was found on any of the six
  products, even though the Campaign estate openly carries a "legacy authentication
  method" and Beta-labelled Content endpoints.
