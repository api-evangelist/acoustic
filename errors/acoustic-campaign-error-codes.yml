note: >-
  Acoustic Campaign is the non-payments sibling of a decline-code registry: a flat
  numeric error registry inherited from Silverpop Engage, returned inside the XML
  API's fault envelope rather than as an RFC 9457 problem document. The REST
  surface uses ordinary HTTP status codes (400/404/422/500) with a separate
  per-operation response-code reference. Captured verbatim from the published
  error-code table; codes are not contiguous because Acoustic has retired some
  numbers over the life of the API.
envelope:
  description: >-
    XML API failures return a Fault element; the numeric code below appears with a
    Fault String element that carries the data-specific detail.
  fields:
    FaultCode: numeric error number from the registry below
    FaultString: human-readable detail naming the offending data
rfc9457: false
