                      readOnly: true
                      description: File name of the resource
                    mediaType:
                      type: string
                      readOnly: true
                      description: Media type of the resource
                    resource:
                      type: string
                      description: the id of the uploaded resource this rendition is for
                      example: 67c621ed48921b7338b84b4f415cba6b
                    links:
