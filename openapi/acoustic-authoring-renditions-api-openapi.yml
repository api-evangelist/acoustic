                      example: 67c621ed48921b7338b84b4f415cba6b
                    links:
                      title: Links
                      type: object
                      readOnly: true
                      properties:
                        self:
                          description: Relative link to the rendition
                          example:
                            href: /authoring/v1/renditions/0a800487f06d71eaf4cffdfde1ab28bc
                          type: object
                          properties:
                            href:
                              type: string
