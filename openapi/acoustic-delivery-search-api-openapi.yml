                - errors
        '414':
          description: The request URL that addresses the search service is larger than the supported size of 4,096 bytes. Reduce the length of the query.
          content:
            application/json:
              schema:
                type: object
                description: This JSON object describes an error condition.
                properties:
                  requestId:
                    type: string
                    description: The unique identifier of the request that failed.
                  service:
