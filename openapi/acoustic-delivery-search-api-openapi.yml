                          description: The locale information of the text provided as 'message' and as 'description' of this error.
                      required:
                      - code
                      - message
                required:
                - requestId
                - errors
        '429':
          description: Too Many Requests, the server has reached a limit, the request must be sent again at a later time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - Unable to complete your request due to an exception. Try again later.
          content:
            application/json:
              schema:
                type: object
                description: This JSON object describes an error condition.
                properties:
                  requestId:
