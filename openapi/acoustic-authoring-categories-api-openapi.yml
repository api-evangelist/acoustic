  /authoring/v1/categories/views/by-modified:
    get:
      tags:
      - Authoring categories
      summary: Gets all categories modified between the start and end date.
      description: 'This endpoint returns a paged result view of category items modified within a range specified by start and end date.<br />User roles: admin, manager, editor, viewer'
      parameters:
      - name: start
        in: query
        description: Provide the date and time of when the last modifications were made to the category items that you want returned. The category items that are modified on or after this date and time are returned. The date value must be in the ISO 8601 format YYYY-MM-DD T hh:mm:ss:sssZ.
        required: false
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        description: Provide the date and time of when the last modifications were made to the category items that you want returned. The category items that are modified on or before this date and time are returned. The date value must be in the ISO 8601 format YYYY-MM-DD T hh:mm:ss:sssZ.
        required: false
        schema:
          type: string
          format: date-time
      - name: fields
        in: query
        description: Only the category items fields that are specified here are returned for each result. Any category item field is a valid value and can be specified as a comma-separated list. For example, to list the category item fields name and ID, provide the value ID, and name. All category item fields are returned by default.
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Use the offset parameter to specify the number of category items to skip from the beginning of the list and return the rest.
        required: false
        schema:
          type: number
          format: integer
      - name: limit
        in: query
        description: Set the limit for the maximum number of category items to return in a single result. The default value is 50.
        required: false
        schema:
          type: number
          format: integer
      - name: order
        in: query
        description: Specify whether you want the category items to be returned in ascending or descending order. Documents are returned in descending order by default.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of category items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit:
                    type: integer
                    description: The page size.
                    example: 50
                  offset:
                    type: integer
                    description: The number of items to skip from the beginning of the list.
                    example: 0
                  href:
                    type: string
                    description: A link to the current page.
                    example: /authoring/v1/categories?offset=50&limit=50
                  next:
                    type: string
                    description: A link to the next page. Only shown if a next page exists.
                    example: /authoring/v1/categories?offset=100&limit=50
                  previous:
                    type: string
                    description: A link to the previous page. Only shown if a previous page exists.
                    example: /authoring/v1/categories?offset=0&limit=50
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The ID of category.
                        rev:
                          type: string
                          description: The revision of category.
                        name:
                          type: string
                          description: The name of the category.
                        classification:
                          type: string
                          description: Either a Taxonomy or category.
                        description:
                          type: string
                          description: A written representation of the category.
                        creatorId:
                          type: string
                          description: The uuid of the user who created the category.
                        permanent:
                          type: boolean
                          description: Used to identify system categories, if true the category can not be deleted.
                        hidden:
                          type: boolean
                          description: If true the category is hidden in the Shell, value is not returned if false.  Default is false.
                        firstClassFor:
                          type: string
                          description: Array of item classifications to which this taxonomy is enabled.  Acceptable values "" and "imagesAndVideos", default "".  By default the taxonomy is only shown where generic selection of any category in any taxonomy is allowed.
                        parent:
                          type: string
                          description: The ID of the parent category. This is only required if the classification is a CATEGORY.
