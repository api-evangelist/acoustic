    get:
      tags:
      - Authoring types
      summary: Retrieve all type documents in the database.
      description: 'Use the /types endpoint to retrieve all content type documents from the database.<br />User roles: admin, manager, editor, viewer'
      parameters:
      - name: offset
        in: query
        description: Use the offset parameter to specify the number of type documents to skip and return the rest.
        required: false
        schema:
          type: number
          format: integer
          default: 0
      - name: limit
        in: query
        description: Set the limit for the number of type documents that are returned.
        required: false
        schema:
          type: number
          format: integer
          default: 50
      - name: format
        in: query
        required: false
        description: "Specify the result format.\n * `feed` - (default) returns a wrapper with links\n * `array` - returns just the array of results\n * `sequence` - each result is a separate JSON document on a new line\n"
        schema:
          type: string
          enum:
          - feed
          - array
          - sequence
      - name: pageMode
        in: query
        required: false
        description: "Specify the next and previous page link mode.\n * `offset` - (default) allows paging forward or backwards, but only a small number of times\n * `deep` - uses index keys to efficiently page through a large result set, but only in one direction\n"
        schema:
          type: string
          enum:
          - offset
          - deep
      - name: order
        in: query
        description: Specify whether you want the type documents to be returned in ascending/alphabetical (default) or descending/reverse-alphabetical order.
        required: false
        schema:
          type: string
          enum:
          - ascending
          - descending
          default: ascending
      - name: fields
        in: query
        description: Only the content type fields that are specified here are returned for each result. Any type document field is a valid value and can be specified as a comma-separated list.
        required: false
        schema:
          type: string
      - name: include
        in: query
        description: "Specify additional fields to include with each result.\nValid options are:\n   * links: Adds the 'links' section (see '#/definitions/DocumentLinks') to the response.\n   * all: Adds all current and future additional fields to the response.\n\nWhen used in-conjunction with the 'fields' option, both the fields that are specified in the 'fields' option and the fields in the 'include' option are returned.\n"
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully lists all content type documents that are requested.
          content:
            application/json:
              schema:
                type: object
                description: A query result that returns type documents.
                properties:
                  offset:
                    type: integer
                    description: number of results to skip.
                  limit:
                    type: integer
                    description: number of results to return.
                  href:
                    type: string
                    description: the url of the current query.
                  next:
                    type: string
                    description: the url for the next page of results. Only present if there are more results.
                  previous:
                    type: string
                    description: the url for the previous page of results. Not present when on the first page.
                  items:
                    type: array
                    items:
                      type: object
                      description: An existing type document.
                      properties:
                        id:
                          type: string
                          description: The ID of the type document.
                          pattern: ^[a-zA-Z0-9*.\-+_~$!',()]*$
                          minLength: 1
                        rev:
                          type: string
                          description: The current revision of the type document.
                          minLength: 1
                        name:
                          type: string
                          description: The name of the type document.
                          pattern: ^[a-zA-Z0-9*. \-+_~$!',()]*$
                          minLength: 1
                        description:
                          type: string
                          description: The description of the type document.
                          pattern: ^[a-zA-Z0-9*. \-+_~$!',()]*$
                        classification:
                          type: string
                          description: the type document classification.
                          enum:
                          - content-type
                        kind:
                          type: array
                          description: "Identifies the sub-classification of the type document.\nValid values include:\n   * custom-ui: This type document has a custom user interface defined\n   * embedded: This type document can be included within another type document\n   * standalone: This type document can be used to create normal content items\n   * page: This type document can be used to create site pages\n   * landing-page: This type document can be used to create landing pages\n   * email: This type document can be used to create email messages\n   * site: This type document can be used to create sites\n"
                          items:
                            type: string
                            enum:
                            - custom-ui
                            - embedded
                            - standalone
                            - page
                            - landing-page
                            - email
                            - site
                        contentThumbnail:
                          type: object
                          description: The thumbnail settings for content using this type.
                          properties:
                            source:
                              type: string
                              enum:
                              - imageElementOrType
                              - imageElement
                              - type
                              - none
                            imageElement:
                              type: string
                              description: When the 'source' is either 'imageElementOrType' or 'imageElement', specifies the element that will be used as the content thumbnail.
                          required:
                          - source
                        creatorId:
                          type: string
                          minLength: 1
                        creator:
                          type: string
                          description: 'The display name of the user that created this Type document. This field is only returned when the ''include'' query string option is set to ''ALL'' or ''metadata''.

                            This field is read only.

                            '
                        created:
                          type: string
                          description: The created date of this type document in ISO 8601 with the format YYYY-MM-DDThh:mm:ss.sssZ. This field is read only.
                          format: date-time
                          minLength: 1
                        lastModifierId:
                          type: string
                          minLength: 1
                        lastModifier:
                          type: string
                          description: 'The display name of the last user that modified this Type document. This field is only returned when the ''include'' query string option is set to ''ALL'' or ''metadata''.

                            This field is read only.

                            '
                        lastModified:
                          type: string
                          description: The last modified date of this type document in ISO 8601 with the format YYYY-MM-DDThh:mm:ss.sssZ. This field is read only.
                          format: date-time
                          minLength: 1
                        path:
                          type: string
                          description: Optional path to associate with this type document. Must be unique. Will default to filesystem friendly version of /[NAME].
                          example: /myTypes/SampleType.json
                        tags:
                          type: array
                          items:
                            type: string
                          uniqueItems: true
                        thumbnail:
                          type: object
                          description: 'The reference to the asset that should act as the thumbnail of this type.

                            The thumbnail can be referred to by either id or path.

                            '
                          properties:
                            id:
                              type: string
                              description: The ID of the asset.
                              example: 6c622bbb-5f5b-45d4-89e1-fce1c054138f
                            path:
                              type: string
                              description: The path of the asset.
                              example: /sales/images/hub.png
                            url:
                              type: string
                              description: The url of the asset.
                              example: /authoring/v1/resources/47d535ff288b3bd8383009abf82a9ea8
                        status:
                          type: string
                          description: the workflow status.
                          enum:
                          - draft
                          - ready
                          - retired
                        linkedDocId:
                          type: string
                          description: Only present on Drafts created from existing Ready items, this property indicates the ID of the associated Ready item
                        uiExtensions:
                          type: object
                          description: Specifies any user interface extensions registered on this type document.
                          properties:
                            element:
                              type: string
                              description: 'Registers a user interface extension that customizes the display of the content elements on the content form.

                                The ''kind'' of the type document should also include the value ''custom-ui''.

                                '
                        icon:
                          type: array
                          description: 'Specifies the type of icon to show for this type document within the Type user interface''s element palette

                            Only used when the type document has a kind that includes ''embedded''

                            '
                          items:
                            type: string
                            enum:
                            - category
                            - datetime
                            - formattedtext
                            - file
                            - group
                            - image
                            - link
                            - location
                            - number
                            - reference
                            - optionselection
                            - text
                            - toggle
                            - variabletype
                            - video
                        elements:
                          type: array
                          description: Represents the elements present on this Type document.
                          items:
                            type: object
                            description: 'Represents an element within a content type.

                              Only properties common to all elements are currently shown.

                              For examples of each of the supported elements, see the documentation for the POST /types end point.

                              '
                            properties:
                              key:
                                type: string
                                description: The element identifer. Within content items, elements are referred to by key only.
                                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                                maxLength: 50
                              label:
                                type: string
                                description: The display name of the element.
                                pattern: ^(?!\\s*$).+
                                maxLength: 100
                              elementType:
                                type: string
                                description: Specifies the type of this element.
                                enum:
                                - category
                                - datetime
                                - file
                                - group
                                - image
                                - link
                                - location
                                - number
                                - reference
                                - text
                                - toggle
                                - video
                              allowMultipleValues:
                                type: boolean
                                description: 'Indicates whether content items using this content-type can contain multiple values of this element.

                                  Valid for all element types except category, toggle and location.

                                  '
                                default: false
                              minimumValues:
                                type: integer
