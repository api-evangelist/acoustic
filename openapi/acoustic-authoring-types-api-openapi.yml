  /authoring/v1/elementdefs/{id}:
    get:
      tags:
      - Authoring types
      summary: Retrieve an existing element definition.
      description: "Use the /elementdefs/{id} end-point to retrieve an existing element definition from the database.\n\nEach element definition describes a variety of element that can be added to a content type.\n\nTo programmatically create a content-type, merge the 'elementFragment' attribute into the 'elements' attribute of the type, performing the following replacements:\n  '$ELEMENT_KEY$': With the desired element key\n  '$ELEMENT_LABEL$': With the desired element label\n<br />User roles: admin, manager, editor, viewer"
      parameters:
      - name: id
        in: path
        description: Provide the ID of the element definition that you want to retrieve.
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Only the element definition fields that are specified here are returned for each result. Any element definition field is a valid value and can be specified as a comma-separated list.
        required: false
        schema:
          type: string
      - name: include
        in: query
        description: "Specify additional fields to include with each result.\nValid options are:\n   * links: Adds the 'links' section (see '#/definitions/DocumentLinks') to the response.\n   * all: Adds all current and future additional fields to the response.\n\nWhen used in-conjunction with the 'fields' option, both the fields that are specified in the 'fields' option and the fields in the 'include' option are returned.\n"
        required: false
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Provide an Etag value from a previous request to check whether the element definition retrieved is the most recent version. If the element definition is the most recent version, the call returns a 304 ( Not modified) message instead of sending the element definition back.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the element definition that matches the ID provided from the database.
          headers:
            Etag:
              description: The Etag value helps identify this document in future requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: An element definition.
                properties:
                  id:
                    type: string
                    description: The ID of the element definition.
                    pattern: ^[a-zA-Z0-9*.\-+_~$!',()]*$
                  rev:
                    type: string
                    description: The current revision of the element definition.
                  name:
                    type: string
                    description: The name of the element definition.
                    pattern: ^[a-zA-Z0-9*. \-+_~$!',()]*$
                    minLength: 1
                  description:
                    type: string
                    description: The description of the element definition.
                    pattern: ^[a-zA-Z0-9*. \-+_~$!',()]*$
                  classification:
                    type: string
                    description: the element definition classification.
                    enum:
                    - element-definition
                  creatorId:
                    type: string
                    minLength: 1
                  created:
                    type: string
                    description: The created date of this element definition in ISO 8601 with the format YYYY-MM-DDThh:mm:ss.sssZ. This field is read only.
                    format: date-time
                    minLength: 1
                  lastModifierId:
                    type: string
                    minLength: 1
                  lastModified:
                    type: string
                    description: The last modified date of this element definition in ISO 8601 with the format YYYY-MM-DDThh:mm:ss.sssZ. This field is read only.
                    format: date-time
                    minLength: 1
                  tags:
                    type: array
                    items:
                      type: string
                    uniqueItems: true
                  status:
                    type: string
                    description: the workflow status.
                    enum:
                    - draft
                    - ready
                    - retired
                  elementFragment:
                    type: object
                    description: The templated the current element.
                    properties:
                      key:
                        type: string
                      type:
                        type: string
        '304':
          description: Not modified. The Etag value that you provided in the If-Match parameter matches the recent document version.
        '404':
          description: The element definition with ID {id} was not found or the current tenant's database is not provisioned.
          content:
