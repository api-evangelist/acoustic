                      properties:
                        id:
                          type: string
                          description: The ID of the type document.
                          pattern: ^[a-zA-Z0-9*.\-+_~$!',()]*$
                          minLength: 1
                        rev:
                          type: string
                          description: The current revision of the type document.
                          minLength: 1
                        name:
                          type: string
                          description: The name of the type document.
                          pattern: ^[a-zA-Z0-9*. \-+_~$!',()]*$
