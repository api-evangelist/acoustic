  /authoring/v1/types/views/by-modified:
    get:
      tags:
      - Authoring types
      summary: Retrieve all type documents in the database ordered by last modified date.
      description: 'Use the /types/views/by-modified endpoint to retrieve all type documents from the database and list them in the order of their last modified date.<br />User roles: admin, manager, editor, viewer'
      parameters:
      - name: start
        in: query
        required: false
        description: 'Provide the date and time of when the last modifications were made to the content types that you want returned.

          When the order is ascending (default), the content types that are modified on or after this date and time are returned.

          When the order is descending, the content types that are modified on or before this date and time are returned.

          The date value must be in the ISO 8601 format YYYY-MM-DD T hh:mm:ss:sssZ.

          '
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        required: false
        description: 'Provide the date and time of when the last modifications were made to the content types that you want returned.

          When the order is ascending (default), the content types that are modified on or before this date and time are returned.

          When the order is descending, the content types that are modified on or after this date and time are returned.

          The date value must be in the ISO 8601 format YYYY-MM-DD T hh:mm:ss:sssZ.

          '
        schema:
          type: string
          format: date-time
      - name: startId
        in: query
        required: false
        description: 'If start does not uniquely identify the result to start from, you can specify the UUID of the result as startId.

          '
        schema:
          type: string
      - name: endId
        in: query
        required: false
        description: 'If end does not uniquely identify the result to end at, you can specify the UUID of the result as endId.

          '
        schema:
          type: string
      - name: offset
        in: query
        description: Use the offset parameter to specify the number of type documents to skip and return the rest.
        required: false
        schema:
          type: number
          format: integer
          default: 0
      - name: limit
        in: query
        description: Set the limit for the number of type documents that are returned.
        required: false
        schema:
          type: number
          format: integer
          default: 50
      - name: format
        in: query
        required: false
        description: "Specify the result format.\n * `feed` - (default) returns a wrapper with links\n * `array` - returns just the array of results\n * `sequence` - each result is a separate JSON document on a new line\n"
        schema:
          type: string
          enum:
          - feed
          - array
          - sequence
      - name: pageMode
        in: query
        required: false
        description: "Specify the next and previous page link mode.\n * `offset` - (default) allows paging forward or backwards, but only a small number of  times\n * `deep` - uses index keys to efficiently page through a large result set, but only in one direction\n"
        schema:
          type: string
          enum:
          - offset
          - deep
      - name: order
        in: query
        description: Specify whether you want the type documents to be returned in ascending/oldest-first (default) or descending/newest-first order.
        required: false
        schema:
          type: string
          enum:
          - ascending
          - descending
          default: ascending
      - name: fields
        in: query
        description: Only the content type fields that are specified here are returned for each result. Any type document field is a valid value and can be specified as a comma-separated list.
        required: false
        schema:
          type: string
      - name: include
        in: query
        description: "Specify additional fields to include with each result.\nValid options are:\n   * links: Adds the 'links' section (see '#/definitions/DocumentLinks') to the response.\n   * all: Adds all current and future additional fields to the response.\n\nWhen used in-conjunction with the 'fields' option, both the fields that are specified in the 'fields' option and the fields in the 'include' option are returned.\n"
        required: false
        schema:
          type: string
      responses:
        '200':
          description: All content type documents that are requested are listed in the order of the last modified date.
          content:
            application/json:
              schema:
                type: object
                description: A query result that returns type documents.
                properties:
                  offset:
                    type: integer
                    description: number of results to skip.
                  limit:
                    type: integer
                    description: number of results to return.
                  href:
                    type: string
                    description: the url of the current query.
                  next:
                    type: string
                    description: the url for the next page of results. Only present if there are more results.
                  previous:
                    type: string
                    description: the url for the previous page of results. Not present when on the first page.
                  items:
                    type: array
