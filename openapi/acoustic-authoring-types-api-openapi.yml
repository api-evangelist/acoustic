                                      Valid for all element types except group

                                      '
                            required:
                            - key
                            - label
                            - elementType
                        links:
                          type: object
                          description: List of available operations, only shown when optional 'include' query string parameter includes 'links'.
                          properties:
                            self:
                              type: object
                              description: self link.
                              properties:
                                href:
                                  type: string
