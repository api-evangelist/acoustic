    get:
      summary: Retrieve an existing image profile.
      description: 'Use the /image-profiles/{id} end-point to retrieve an existing image profile from the database.<br />User roles: admin, manager, editor, viewer'
      parameters:
      - name: id
        in: path
        description: The ID of the image profile to retrieve.
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: A comma separated list that when specified, limits the fields returned to just those specified. Any type document field is a valid value.
        required: false
        schema:
          type: string
      - name: include
        in: query
        description: "A comma separated list of additional fields (which are normally hidden) to add to the response.\nValid options are:\n     * metadata: Adds additional details such as creator and last modifier to the response.\n     * all: Adds all current and future additional fields to the response.\nWhen used in-conjunction with the 'fields' option, both sets of fields are returned. ie. those specified in the 'fields' option and those specified in the 'include' option.\n"
        required: false
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Provide an Etag value from a previous request to check whether the image profile retrieved is the most recent version. If the image profile is the most recent version, the call returns a 304 ( Not modified) message instead of sending the image profile back.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success.
          headers:
            Etag:
              description: The Etag value helps identify this document in future requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: An existing image profile.
                properties:
                  id:
                    type: string
                    description: The ID of the image profile.
                    pattern: ^[a-zA-Z0-9*.\-+_~$!',()]*$
                    minLength: 1
                  rev:
                    type: string
                    description: The current revision of the image profile.
                    minLength: 1
                  name:
                    type: string
                    description: The name of the image profile.
                    pattern: ^[a-zA-Z0-9*. \-+_~$!',()]*$
                    minLength: 1
                  description:
                    type: string
                    description: The description of the image profile.
                    pattern: ^[a-zA-Z0-9*. \-+_~$!',()]*$
                  classification:
                    enum:
                    - image-profile
                  creatorId:
                    type: string
                    description: The ID of the user that created the image profile.
                    minLength: 1
                  creator:
                    type: string
                    description: 'The display name of the user that created the image profile. This field is only returned when the ''include'' query string option is set to ''ALL'' or ''metadata''.

                      This field is read only.

                      '
                  created:
                    type: string
                    description: The created date of this image profile in ISO 8601 with the format YYYY-MM-DDThh:mm:ss.sssZ. This field is read only.
                    format: date-time
                    minLength: 1
                  lastModifierId:
                    type: string
                    description: The ID of the user that last modified the image profile.
                    minLength: 1
                  lastModifier:
                    type: string
                    description: 'The display name of the last user that modified the image profile. This field is only returned when the ''include'' query string option is set to ''ALL'' or ''metadata''.

                      This field is read only.

                      '
                  lastModified:
                    type: string
                    description: The last modified date of this image profile in ISO 8601 with the format YYYY-MM-DDThh:mm:ss.sssZ. This field is read only.
                    format: date-time
                    minLength: 1
                  tags:
                    type: array
                    items:
                      type: string
                    uniqueItems: true
                    example:
                    - news
                    - sample
                  dimensions:
                    type: array
                    items:
                      type: object
                      description: A indiviual dimension within an image profile.
                      properties:
                        label:
                          type: string
                          description: The dimension label.
                        key:
                          type: string
                          description: The dimension key.
                        description:
                          type: string
                          description: The description of the dimension.
                        width:
                          type: number
                          description: The dimension's width
                        height:
                          type: number
                          description: The dimension's height
                  isSystem:
                    type: boolean
                    description: Indicates whether this item is a 'system item' or not.
                    default: false
                required:
                - rev
                - name
                - classification
                - creatorId
                - dimensions
        '304':
          description: Not modified is returned when using If-None-Match header and the value matches the latest version of the item.
        '404':
          description: The document with ID {id} was not found OR Current tenant's database is not provisioned.
