  /authoring/v1/image-profiles/views/by-modified:
    get:
      summary: Retrieve all image profiles in the database ordered by last modified date.
      description: 'Use the /image-profiles/views/by-modified endpoint to retrieve all image profiles from the database and list them in the order of their last modified date.<br />User roles: admin, manager, editor, viewer'
      parameters:
      - name: start
        in: query
        required: false
        description: 'Provide the date and time of when the last modifications were made to the image profiles that you want returned.

          When the order is ascending (default), the image profiles that are modified on or after this date and time are returned.

          When the order is descending, the image profiles that are modified on or before this date and time are returned.

          The date value must be in the ISO 8601 format YYYY-MM-DD T hh:mm:ss:sssZ.

          '
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        required: false
        description: 'Provide the date and time of when the last modifications were made to the image profiles that you want returned.

          When the order is ascending (default), the image profiles that are modified on or before this date and time are returned.

          When the order is descending, the image profiles that are modified on or after this date and time are returned.

          The date value must be in the ISO 8601 format YYYY-MM-DD T hh:mm:ss:sssZ.

          '
        schema:
          type: string
          format: date-time
      - name: startId
        in: query
        required: false
        description: 'If start does not uniquely identify the result to start from, you can specify the UUID of the result as startId.

          '
        schema:
          type: string
      - name: endId
        in: query
        required: false
        description: 'If end does not uniquely identify the result to end at, you can specify the UUID of the result as endId.

