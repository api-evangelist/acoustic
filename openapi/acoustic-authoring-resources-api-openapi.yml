  /authoring/v1/resources/views/by-created:
    get:
      summary: Retrieve all resources created within the specified date range.
      description: 'Use this endpoint to retrieve all resources that was created within the date range specified.<br />User roles: admin, manager, editor, viewer'
      parameters:
      - name: start
        in: query
        required: false
        description: 'Provide the date and time of when the resource was created. Resources that were created on or after this date and time are returned. The date value must be in the ISO 8601 format YYYY-MM-DD T hh:mm:ss:sssZ. Note: when reversing the order you do not switch start and end.'
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        required: false
        description: 'Provide the date and time of when the resource was created. Resources that were created on or before this date and time are returned. The date value must be in the ISO 8601 format YYYY-MM-DD T hh:mm:ss:sssZ. Note: when reversing the order you do not switch start and end.'
        schema:
          type: string
          format: date-time
      - name: startId
        in: query
        required: false
        description: 'If start does not uniquely identify the result to start from, you can specify the UUID of the result as startId. Note: when reversing the order you do not switch start and end ids.'
        schema:
          type: string
      - name: endId
        in: query
        required: false
        description: 'If end does not uniquely identify the result to end at, you can specify the UUID of the result as endId. Note: when reversing the order you do not switch start and end ids.'
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Set the limit for the maximum number of resource items to return in a single result. The default value is 50. You can pass 0 to unset the limit and stream all available results. A streaming parser can be avoided with format=sequence.
        schema:
          type: number
          format: integer
      - name: format
        in: query
        required: false
        description: "Specify the result format.\n * `feed` - (default) returns a wrapper with links\n * `array` - returns just the array of results\n * `sequence` - each result is a separate JSON document on a new line\n"
        schema:
          type: string
          enum:
          - feed
          - array
          - sequence
      - name: offset
        in: query
        required: false
