  /delivery/v1/rendering/context/{id}:
    get:
      summary: Delivery Rendering Context By ID
      description: 'Use the `rendering/context/{id}` endpoint to retrieve the rendering context for the specified content ID.


        The response contains the delivery content structure with resolved content element references. The resolution replaces content elements of type reference with the referenced rendering context. It is resolved recursively if the resolved content structure contains content elements of type reference.



        **Cycle detection**


        Referenced content can have cycles. In a cyclic structure, references link back to itself, often through references in between. The API detects and stops cycles to serialize the content structure. If a cycle is detected, the API stops the replacements of the referenced elements and sets a cycle marker property instead. The cycle marker property has the key "$$CYCLE" and the value of the detected cycling content ID. The content ID can be used to find the referenced content structure in the parent hierarchy.

        <br />User roles: admin, manager, editor, viewer, authenticatedVisitor, anonymous'
      parameters:
      - in: path
        name: id
        description: Provide the ID of the resource. Note that IDs are always the IDs of published item, even if a draft exists with a different ID. For a site, use `@current` to indicate that the ID of the site is derived from the addressed URL via custom domain site mapping or URL path based site addressing. For further details consult the Content documentation.
        required: true
        schema:
          type: string
      - name: callback
        description: Provide the JSONP callback name for JSONP support. The callback name must designate a javascript function that can be executed in the global scope. The argument will be the deserialized JSON object.
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the delivery rendering context.
          content:
            application/json:
              schema:
                type: object
                items:
                  title: RenderingContext
                  type: object
                  properties:
                    id:
                      type: string
                      description: The ID of the content item.
                    rev:
                      type: string
                      description: The current revision of the document.
                    name:
                      type: string
                      description: The name of the content item.
                    classification:
                      type: string
                      description: The classification defines the document type. For content items, all documents are classified as "content".
                    typeId:
                      type: string
                      description: The ID of the content type this item belongs to.
                    locale:
                      type: string
                      description: The locale of the document (e.g "en", or "de").
                    lastModified:
                      type: string
                      format: date-time
                      description: The last modified date of this content item in ISO 8601 with the format YYYY-MM-DDTHH:mm:ss.sssZ.
                    lastModifierId:
                      type: string
                      description: The name of user for now, this property may change once user management is defined (read only).
                    created:
                      type: string
                      format: date-time
                      description: The created date of this content item in ISO 8601 with the format YYYY-MM-DDTHH:mm:ss.sssZ.
                    creatorId:
                      type: string
                      description: The ID of the creator
                    layouts:
                      description: The layouts of the content item
                      type: object
                    tags:
                      type: array
                      items:
                        type: string
                      uniqueItems: true
                      description: The tags describing the content item.
                    elements:
                      type: object
                      description: Defined by the type and captured in the schema given by the type, in a real content, this property will be filled with more information.
                    description:
                      type: string
                      description: The description of the content item.
                    type:
                      type: string
                      description: The link to the content type document this content is based on.
        '304':
          description: Not modified
        '404':
          description: The delivery rendering context for the specified ID was not found.
          content:
            application/json:
              schema:
                type: object
                description: This JSON object describes an error condition.
                properties:
                  requestId:
                    type: string
                    description: The unique identifier of the request that failed.
                  service:
                    type: string
                    description: The name of the service that reports the error.
                  errors:
                    type: array
                    items:
                      type: object
                      description: This JSON object describes a specific error of an error condition.
                      properties:
                        code:
                          type: integer
                          description: An error code that is specific to the service that reports the error.
                        message:
                          type: string
                          description: A message that describes what went wrong.
                        description:
                          type: string
                          description: A more detailed explanation of the error condition and recommended steps to resolve the issue.
                        more_info:
                          type: string
                          description: A URL pointing to a source that provides more information on this error.
                        level:
                          type: string
                          enum:
                          - ERROR
