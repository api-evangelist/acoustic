openapi: 3.2.0
info:
  title: Acoustic Delivery render API
  version: 1.0.142
  x-ibm-name: ibm-watson-content-hub-api
  description: 'Operations tagged Delivery render across 2 of this provider''s published API definitions: acoustic-content-openapi-original.json, acoustic-content-swagger2-original.yaml. Each path carries the servers of the definition it was published in.'
tags:
- name: Delivery render
  description: 'The Content Delivery rendering REST API provides information to render content and pages in client-side applications.


    **Client-side programming support**


    If you want to create a client-side application with Angular 4, you can use the [Acoustic Angular SDK for Content](https://www.npmjs.com/package/@acoustic-content-sdk/ng-api). With the Angular SDK, you can retrieve and render content and pages from Content without any need to interact with the REST API directly.


    **Conditional GET requests**


    The API supports ETag and Last-modified [conditional GET requests](https://developer.mozilla.org/en-US/docs/Web/HTTP/Conditional_requests). It is highly recommended to use conditional GET requests with ETags to decrease the communication data between client and API. The API provides ETag and Last-modified header response information if available. The client can send conditional GET requests with ETag and Last-modified information to validate local client data. The API responds with a `304 - Not modified response` with empty content if the condition is still valid.


    **JSONP support**


    The API has [JSONP support](https://www.w3schools.com/js/js_json_jsonp.asp). The client can activate the JSONP support by providing the JSONP callback name query parameter.


    **Preview support**


    The API supports the previewing of content information as described [here](https://developer.goacoustic.com/acoustic-content/docs/preview-content).



    **Usage**


    In order to render content and the page structure in client-side applications you must to consider the following aspects&#58;


    * Identify the addressed page that correlates to the application routing state.

    * Identify the addressed content and layout information and render the content.


    With the following steps you can achieve these aspects&#58;


    1. Retrieve the site and page information by using the "Delivery Site By ID" API route. The response contains information to identify the page that correlates to the navigational state (route) of the application.

    2. The page information has the property "contentId" that references the content of the page. Use that property to get the content ID.

    3. Use the content ID in combination with the "Delivery Rendering Context By ID" API route to retrieve the rendering context information of the content item. The rendering context contains the layout information of the content item and content references, including the resolved rendering context of the referenced items.

    4. Based on the provided layout information, identify the related the layout component of your application and render the content item by using the layout component. If required the layout can render nested layouts.

    '
paths:
  /delivery/v1/rendering/render/content/{id}:
    get:
      summary: Applies server side rendering to the specified content item
      description: 'Applies server side rendering to the specified content item<br />User roles: admin, manager, editor, viewer, authenticatedVisitor, anonymous'
      parameters:
      - in: path
        name: id
        description: Provide the ID of the resource. Note that IDs are always the IDs of published item, even if a draft exists with a different ID. For a site, use `@current` to indicate that the ID of the site is derived from the addressed URL via custom domain site mapping or URL path based site addressing. For further details consult the Content documentation.
        required: true
        schema:
          type: string
      - in: query
        name: layoutId
        description: Provide the ID of the layout to be used to pre-render the resource.
        required: false
        schema:
          type: string
      - in: query
        name: contentType
        description: Specifies the content type to be set on the response. Default is text/html.
        required: false
        schema:
          type: string
      - name: callback
        description: Provide the JSONP callback name for JSONP support. The callback name must designate a javascript function that can be executed in the global scope. The argument will be the deserialized JSON object.
        in: query
        required: false
        schema:
          type: string
      - in: query
        name: rcParam
        description: By specifying query parameters with arbitrary names, but start with the prefix 'rc' or 'RC' (case insensitive), e.g., 'RcParam1', 'rcMy', you can provide custom parameters that will be added to the rendering context JSON under the $context.customParameters section.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the rendering.
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Too Many Requests, the server has reached a limit, the request must be sent again at a later time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server Error
          content:
            text/html:
              schema:
                type: object
                description: This JSON object describes an error condition.
                properties:
                  requestId:
                    type: string
                    description: The unique identifier of the request that failed.
                  service:
                    type: string
                    description: The name of the service that reports the error.
                  errors:
                    type: array
                    items:
                      type: object
                      description: This JSON object describes a specific error of an error condition.
                      properties:
                        code:
                          type: integer
                          description: An error code that is specific to the service that reports the error.
                        message:
                          type: string
                          description: A message that describes what went wrong.
                        description:
                          type: string
                          description: A more detailed explanation of the error condition and recommended steps to resolve the issue.
                        more_info:
                          type: string
                          description: A URL pointing to a source that provides more information on this error.
                        level:
                          type: string
                          enum:
                          - ERROR
                          - WARNING
                          description: The severity of this error.
                        parameters:
                          type: object
                          description: Additional properties that represent dynamic parts used in the 'message'.
                        cause:
                          type: object
                          description: The error message that was produced by a downstream service and represents the cause of this error.
                        locale:
                          type: string
                          description: The locale information of the text provided as 'message' and as 'description' of this error.
                      required:
                      - code
                      - message
                required:
                - requestId
                - errors
      x-ibm-dx-security-user-roles:
      - admin
      - manager
      - editor
      - viewer
      - authenticatedVisitor
      - anonymous
      x-ibm-dx-vary: []
      tags:
      - Delivery render
