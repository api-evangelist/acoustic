          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                items:
                  title: Site Metadata
                  description: Site Metadata
                  type: object
                  properties:
                    id:
                      type: string
                      description: The ID of the site.
                    rev:
                      type: string
                      description: The current revision of the document.
                    name:
                      type: string
                      description: The name of the site.
                    classification:
                      type: string
                      description: The classification of site. This is always `site`.
                    lastModified:
                      type: string
                      description: The last modified date of this site metadata in ISO 8601 with the format YYYY-MM-DDTHH:mm:ss.sssZ.
                    lastModifierId:
                      type: string
                      description: This is the user ID of the user that modified the site metadata.
                    created:
                      type: string
                      description: The creation date of this site metadata in ISO 8601 with the format YYYY-MM-DDTHH:mm:ss.sssZ.
                    creatorId:
                      type: string
                      description: This is the user ID of the user that created the site metadata.
                    pages:
                      type: array
                      items:
                        title: Page Metadata
                        description: Page Metadata
                        type: object
                        properties:
                          id:
                            type: string
                            description: The ID of the page item.
                          rev:
                            type: string
                            description: The current revision of the document.
                          name:
                            type: string
                            description: The name of the page item.
                          contentId:
                            type: string
                            description: The ID of the page content item this item represents.
                          contentTypeId:
                            type: string
                            description: The ID of the page content type.
                          position:
                            type: string
                            description: Position relative to sibling pages giving the order of the pages. Position is an integer value starting at 0.
                          description:
                            type: string
                            description: Page description.
                          layoutId:
                            type: string
                            description: Page layout template ID.
                          segment:
                            type: string
                            description: Friendly URL segment.
                          title:
                            type: string
                            description: Page title.
                          parentId:
                            type: string
                            description: The ID of the parent page. Not present if it is the root page.
                          classification:
                            type: string
                            description: The classification of the page. This is always `page`.
                          lastModified:
                            type: string
                            description: The last modified date of this page in ISO 8601 with the format YYYY-MM-DDTHH:mm:ss.sssZ.
                          lastModifierId:
                            type: string
                            description: This is the user ID of the user that modified the page.
                          created:
                            type: string
                            description: The creation date of this page in ISO 8601 with the format YYYY-MM-DDTHH:mm:ss.sssZ.
                          creatorId:
                            type: string
                            description: This is the user ID of the user that created the page.
                          route:
                            type: string
                            description: This is the url path of the page.
                          url:
                            type: string
                            description: This is the server relative url server relative.
                          children:
                            type: array
                            items:
                              type: object
                            description: This is an array of the hierarchical child pages of this hierarchical page.
                      description: The page hierarchy of the site.
        '304':
          description: Not modified
        '404':
