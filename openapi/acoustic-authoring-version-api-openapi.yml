  /authoring/v1/versions/policy:
    get:
      summary: Retrieve the current version policy.
      description: 'Use this endpoint to fetch the current version policy that determines how specific documents are versioned in the authoring system.

        Only the policy status is being returned at this point.

        <br />User roles: admin, manager, editor, viewer'
      tags:
      - Authoring version
      responses:
        '200':
          description: Successfully retrieved version policy.
          content:
            application/json:
              schema:
                type: object
                description: Response to indicate if the version policy status is in effect.
                properties:
                  policy-status:
                    type: string
                    description: Flag that determines if the version policy is in effect; possible values - on, off, disabled.
                example:
                  policyStatus: 'on'
        '429':
          description: Too Many Requests, the server has reached a limit, the request must be sent again at a later time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Unable to retrieve the version-policy from the database as the service is unavailable. Try again later.
          content:
            application/json:
              schema:
                type: object
                description: An error response.
                properties:
                  requestId:
                    type: string
                    description: The current request ID
                  service:
                    type: string
                    description: The name of the service that produced the error
                  requestMethod:
                    type: string
                    description: The Http method type of the current request
                  requestUri:
                    type: string
                    description: The request uri
                  errors:
                    type: array
                    items:
                      type: object
                      description: an individual error, info or warning message.
                      properties:
                        code:
