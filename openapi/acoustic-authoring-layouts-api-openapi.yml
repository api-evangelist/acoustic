        schema:
          type: string
      - name: offset
        in: query
        description: Use the offset parameter to specify the number of layouts to skip and return the rest.
        required: false
        schema:
          type: number
          format: integer
          default: 0
      - name: limit
        in: query
        description: Set the limit for the number of layouts that are returned.
        required: false
        schema:
          type: number
          format: integer
          default: 50
      - name: format
        in: query
