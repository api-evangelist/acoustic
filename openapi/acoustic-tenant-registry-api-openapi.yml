                  properties:
                    enabled:
                      type: boolean
                      description: True if mandatory approval is enabled
                    exemptContentTypes:
                      type: array
                      items:
                        type: string
                ibmCommerce:
                  type: object
                  properties:
                    tenantId:
                      type: string
                    apiGatewayHost:
                      type: string
                    previewSearchHost:
                      type: string
                    previewTransactionHost:
                      type: string
                    liveSearchHost:
