      summary: Update a tenant
      description: '##### Example request using curl


        `curl -X PUT -d ''{"_id":"85b4686b-8614-475f-8933-144d42f84521","locale":"de", "name":"sample_tenant"}'' {api-url}/registry/v1/currenttenant`

        <br />User roles: admin'
      requestBody:
