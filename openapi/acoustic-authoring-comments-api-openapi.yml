  /authoring/v1/comments/by-item/{classification}/{id}:
    get:
      summary: Retrieve all comments for a specific item.
      description: 'Use the /comments/by-item/{classification}/{id} endpoint to fetch all comments that are associated to a specific item. Use the query parameter ''since'' to fetch comments since a specific date. Conditional requests are supported.<br />User roles: admin, manager, editor, viewer'
      parameters:
      - name: classification
        in: path
        description: Provide the classification of the item for which you want to retrieve the comments.
        required: true
        schema:
          type: string
          format: string
      - name: id
        in: path
        description: Provide ID of the item for which you want to retrieve the comments.
        required: true
        schema:
          type: string
          format: string
      - name: since
        in: query
        description: Provide the date from when to retrieve comments. Only comments that were added after this date are retrieved. The date value must be in the ISO 8601 format YYYY-MM-DD T hh:mm:ss:sssZ.
        required: false
        schema:
          type: string
          format: date-time
      - name: offset
        in: query
        description: Use the offset parameter to specify the number of comments to skip from the beginning of the list and return the rest.
        required: false
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Set the limit for the maximum number of comments to return in a single result. The maximum number of comments that are returned by default is 50.
        required: false
        schema:
          type: integer
          default: 50
      - name: order
        in: query
        description: Specify whether you want the comments to be returned in ascending or descending order. Comments are returned in descending order by default.
        required: false
        schema:
          type: string
          enum:
          - descending
          - ascending
          default: descending
      - name: fields
        in: query
        description: Only the comment properties that are specified here are returned for each result. Any comment property is a valid value and can be specified in a comma-separated list. For example, to show only the comment properties message and creatorId, provide the values of message and creatorId. All comment properties are returned by default.
        required: false
        allowEmptyValue: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      tags:
      - Authoring comments
      responses:
        '200':
          description: Successfully lists a paged result view of all comments for the given item, optionally filtered by date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit:
                    type: integer
                    description: The page size.
                    example: 50
                  offset:
                    type: integer
                    description: The number of items to skip from the beginning of the list.
                    example: 0
                  href:
                    type: string
                    description: A link to the current page.
                    example: /comments?offset=50&limit=50
                  next:
                    type: string
                    description: A link to the next page. Only shown if a next page exists.
                    example: /comments?offset=100&limit=50
                  previous:
                    type: string
                    description: A link to the previous page. Only shown if a previous page exists.
                    example: /comments?offset=0&limit=50
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        creatorId:
                          type: string
                          description: The ID of the user that created the commment.
                          example: f8c1344e-2296-441b-a8a6-f8d46b72a787
                        id:
                          type: string
                          description: The id of the comment.
                          example: 95927bcd-9da3-4d8a-9fbf-ffcabe80a8a4
                        rev:
                          type: string
                          description: The revision of the comment.
                          example: 2-c839bbb8844549c2e298275c4b2adcb8
                        message:
                          type: string
                          description: The actual comment message.
                          example: More images should be added to slideshow
                        created:
                          type: string
                          format: date-time
                          description: ISO-8601 formatted date.
                          example: '2017-05-28T22:59:27.610Z'
                        target:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The id of the item that the comment is associated with.
                              example: 6eac5498-3545-458a-962b-e17742aa7b56
                            classification:
                              type: string
                              description: The classification of the item that the comment is associated with.
                              enum:
                              - asset
                              - content
                              example: content
                          required:
                          - id
                          - classification
                        threadId:
                          type: string
                          description: The id string of the thread that this comment belongs to.
                          example: b3a18c87-8be0-4938-bba9-98a4cea35200
                        classification:
                          type: string
                          description: The comment's classification.
                          example: Comment
                        kind:
                          type: array
                          description: The "kind" of comment that this is. By default, all comments created by users are "user" comments.
                          default:
                          - user
                          items:
                            type: string
                            enum:
                            - user
                            - system
                        creator:
                          type: string
                          description: Display name of the user who created this comment.
                          example: Krista
                        lastModifier:
                          type: string
                          description: The display name of the user who last edited the comment.
                          example: Krista
                        lastModifierId:
                          type: string
                          description: The ID of the user who last edited the comment.
                          example: f8c1344e-2296-441b-a8a6-f8d46b72a787
                        lastModified:
                          type: string
                          description: The ISO-8601 timestamp that the comment was last modified.
                          example: '2017-05-28T22:59:27.610Z'
                        resolved:
                          type: boolean
                          default: false
                          description: Used for resolving comments during a review. This property is false by default and changes to true when the comment is resolved.
                      required:
                      - id
                      - rev
                      - classification
                      - created
                      - creator
                      - creatorId
                      - kind
                      - lastModified
                      - lastModifier
                      - lastModifierId
                      - message
                      - resolved
                      - target
                      - threadId
                required:
                - limit
                - offset
                - href
                - items
