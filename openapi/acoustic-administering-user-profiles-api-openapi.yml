        name: external-id
        description: The unique external identifier of the user (e.g. BlueID).
        required: false
        schema:
          type: string
          format: email
          maxLength: 512
      - name: privacy-notice
        in: query
        description: Parameter which must be set if the users privacy notice should be returned
        required: false
        schema:
          type: string
          default: false
      - name: offset
        in: query
        description: The index of the first item to be included in the response
        required: false
        schema:
          type: string
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        description: The maximum number of items to be included in the response
        required: false
        schema:
          type: string
          format: int32
          minimum: 1
          maximum: 10000
          default: 10
      - name: include
        in: query
        description: Include additional information sections
        required: false
        style: form
        explode: false
        schema:
          type: string
          items:
            type: string
            enum:
            - links
            - none
