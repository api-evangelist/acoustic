                      description: The user object that might be returned.
                      type: object
                      required:
                      - externalId
                      - id
                      - roles
                      properties:
                        id:
                          type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
