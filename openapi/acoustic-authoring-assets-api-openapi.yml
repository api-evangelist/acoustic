                              description: Name of person
                              readOnly: true
                              example: Brad Pitt
                            gender:
                              type: string
                              description: Gender of person
                              readOnly: true
                              example: Male
                            age:
                              type: object
                              description: Age range of person
                              readOnly: true
                              properties:
                                minimum:
                                  type: integer
                                  description: Minimum age of person
                                  readOnly: true
                                  example: 35
                                maximum:
                                  type: integer
                                  description: Maximum age of person
                                  readOnly: true
                                  example: 44
                      colors:
                        type: object
                        description: Prominent colors from an image. Image asset only
                        readOnly: true
                        properties:
                          vibrant:
                            type: string
                            example: '#c78061'
                            readOnly: true
                          muted:
                            type: string
                            readOnly: true
                            example: '#ae7157'
                          darkVibrant:
                            type: string
                            readOnly: true
                            example: '#4c2c1c'
                          darkMuted:
                            type: string
                            readOnly: true
                            example: '#50453f'
                          lightVibrant:
                            type: string
                            readOnly: true
                            example: '#d4a185'
                          lightMuted:
                            type: string
                            readOnly: true
                            example: '#d4bcac'
                      concepts:
                        type: array
                        description: Perform concept extraction operations from documents
                        readOnly: true
                        items:
                          type: string
                          example:
                          - Want
                          - Need
                          - 2006 albums
                      entities:
                        type: string
                        description: Perform entity extraction operations from documents
                        readOnly: true
                        example: people
                      keywords:
                        type: array
                        description: Perform keyword extraction operations from documents
                        readOnly: true
                        items:
                          type: string
                          example:
                          - new theme
                          - document
                          - video
                          - cover page
                      status:
                        type: string
                        description: This field indicates the progress of AI analysis
                        readOnly: true
                        enum:
                        - complete
                        - failed
                        - none
                        - pending
                  isManaged:
                    type: boolean
                    readOnly: true
                    description: This field indicates whether the asset is managed or not. An asset is considered managed only if its asset path starts with "dxdam".
                  altText:
                    type: string
                    description: A text description of the asset, used when the asset itself is not available or not displayed.
                    example: This is an image of the Acoustic logo.
                  caption:
                    type: string
                    description: A caption of the asset image.
                    example: Acoustic
                  linkedDocId:
                    type: string
                    readOnly: true
                    description: Provided on drafts of existing items. This is the ID of the primary item.
                    example: b289c02e-2c61-4643-aba6-e6b4e94c76e3
                  categories:
                    type: array
                    items:
                      type: string
                      description: The taxonomy categories that the user has associated the asset to.
                      example: banner
                  isSystem:
                    type: boolean
                    description: Indicates whether this item is a 'system item' or not. 'System item' means that this is an item managed internally by Acoustic.
                    default: false
                  libraryId:
                    type: string
                    description: If this property is set it points to library id that the item is assigned to.
