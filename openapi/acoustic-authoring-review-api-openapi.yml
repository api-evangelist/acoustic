  /authoring/v1/review/{id}/approve:
    post:
      summary: Approve items in a review.
      description: "Use the /review/{id}/approve endpoint to approve items in the specified review. \nThis endpoint approves the items that you specify that were added to the specified review in bulk. For example, if Content A, Content B, and Asset C were added to a review, and you requested approval for Content A and Asset C, then only the items that you requested are approved. Check whether the items were successfully approved from the approvals field in the returned API representation of review model. You can identify the items that failed to approve by checking the item IDs that are listed in the response header. The review is automatically complete when all items that were requested for approval are approved.\n<br />User roles: admin, manager, editor"
      parameters:
      - name: id
        in: path
        description: Provide the ID of the review that you want to approve.
        required: true
        schema:
          type: string
      requestBody:
        content:
