      - editor
      tags:
      - Publishing
      summary: Retrieve the status of current-job
      description: 'Use the /jobs/current-job/status endpoint to retrieve the status information for the current-job.<br />User roles: admin, manager, editor'
      responses:
        '200':
          description: Successfully retrieved the status for the current-job.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - created
                - messages
                - lastModified
                - state
                - tasks
                properties:
                  id:
                    type: string
                    description: Unique identifier of associated job
                    maxLength: 64
                  created:
                    type: string
                    format: date-time
                    description: date when this item was created
                  lastModified:
                    type: string
                    format: date-time
                    description: date when this item was modifed for the last time
                  state:
                    type: string
                    description: Enumeration of publishing job states
                    enum:
                    - READY
                    - BUILDING
                    - PENDING
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: Indicates which type of task is reported.
                          enum:
                          - PUBLISH_ASSET
                          - PUBLISH_CATEGORY
                          - PUBLISH_CONTENT
                          - PUBLISH_PAGE
                          - PUBLISH_SITE
                          - PUBLISH_RESOURCE
                        messageType:
                          type: string
                          description: Indicates if the task has been successful.
                          enum:
                          - ERROR
                          - INFO
                          - WARNING
                        num:
                          type: integer
                          format: int32
                        total:
                          type: integer
                          format: int32
                        docs:
                          type: object
                          description: Map which enumerates the events that shall be published grouped by their classification ('content', 'asset', etc.).
                          properties:
                            content:
                              type: object
                              description: Map which enumerates the items that shall be published groupd by their event type ('created', 'updated', etc.)
                              properties:
                                created:
                                  description: List of items that have been created
                                  type: array
                                  items:
                                    type: string
                                updated:
                                  description: List of items that have been updated
                                  type: array
                                  items:
                                    type: string
                                deleted:
                                  description: List of items that have been deleted
                                  type: array
                                  items:
                                    type: string
                            page:
                              type: object
                              description: Map which enumerates the items that shall be published groupd by their event type ('created', 'updated', etc.)
                              properties:
                                created:
                                  description: List of items that have been created
                                  type: array
                                  items:
                                    type: string
                                updated:
                                  description: List of items that have been updated
                                  type: array
                                  items:
                                    type: string
                                deleted:
                                  description: List of items that have been deleted
                                  type: array
                                  items:
                                    type: string
                            site:
                              type: object
                              description: Map which enumerates the items that shall be published groupd by their event type ('created', 'updated', etc.)
                              properties:
                                created:
                                  description: List of items that have been created
                                  type: array
                                  items:
                                    type: string
                                updated:
                                  description: List of items that have been updated
                                  type: array
                                  items:
                                    type: string
                                deleted:
                                  description: List of items that have been deleted
                                  type: array
                                  items:
                                    type: string
                            asset:
                              type: object
                              description: Map which enumerates the items that shall be published groupd by their event type ('created', 'updated', etc.)
                              properties:
                                created:
                                  description: List of items that have been created
                                  type: array
                                  items:
                                    type: string
                                updated:
                                  description: List of items that have been updated
                                  type: array
                                  items:
                                    type: string
                                deleted:
                                  description: List of items that have been deleted
                                  type: array
                                  items:
                                    type: string
                            category:
                              type: object
                              description: Map which enumerates the items that shall be published groupd by their event type ('created', 'updated', etc.)
                              properties:
                                created:
                                  description: List of items that have been created
                                  type: array
                                  items:
                                    type: string
                                updated:
                                  description: List of items that have been updated
                                  type: array
                                  items:
                                    type: string
                                deleted:
                                  description: List of items that have been deleted
