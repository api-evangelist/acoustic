  /publishing/v1/site-revisions/default:
    x-ibm-dx-security-user-roles:
    - admin
    - manager
    get:
      x-ibm-dx-security-user-roles:
      - admin
      - manager
      - editor
      tags:
      - Publishing
      summary: Get the default site revision
      description: 'Use the /site-revisions/default endpoint to retrieve the default site revision<br />User roles: admin, manager, editor'
      parameters:
      - name: include
        in: query
        description: Optional include parameter. Currently the links section can be included using the value 'links'.
        required: false
        style: form
        explode: false
        schema:
          type: string
          items:
            type: string
            enum:
            - links
            - none
      responses:
        '200':
          description: The default site revision
          headers:
            Content-Location:
              description: URL of the actual revision of the returned item
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  required:
                  - id
                  - rev
                  - created
                  - creator
                  - lastModified
                  - lastModifier
                  properties:
                    links:
                      type: object
                      required:
                      - self
                      properties:
                        self:
                          type: object
                          required:
                          - href
                          - methods
                          description: url pointing to this document
                          properties:
                            href:
                              type: string
                              maxLength: 1024
                            methods:
                              type: array
                              items:
                                type: string
                                enum:
                                - GET
                                - POST
                                - PUT
                                - DELETE
                            name:
                              description: single value object where key is the locale and value is the display name
                              type: object
                    id:
                      type: string
                      description: Unique identifier representing a specific item
                      maxLength: 64
                    rev:
                      type: string
                      maxLength: 64
                      description: a string identifying a specific version of the document
                    created:
                      type: string
                      format: date-time
                      description: date when this item was created
                    creator:
                      type: object
                      required:
                      - id
                      description: A reference to the User who has created the item
                      properties:
                        id:
                          type: string
                          maxLength: 64
                    lastModified:
                      type: string
                      format: date-time
                      description: date when this item was modifed for the last time
                    lastModifier:
                      type: object
                      required:
                      - id
                      description: A reference to the User who has modified the item
                      properties:
                        id:
                          type: string
                          maxLength: 64
                - type: object
                  required:
                  - name
                  properties:
                    description:
                      type: object
                      description: an object holding the localized description for multiple languages
                    name:
                      type: object
                      description: an object holding the localized title for multiple languages
                - type: object
                  properties:
                    state:
                      type: string
                      description: State of the site revision
                      enum:
                      - READY
                      - BUILDING
                      - PENDING
                    autoPublishEnabled:
                      description: If true, any updates affecting this site revision will be published automatically. Default is true.
                      type: boolean
                    lastSucceeded:
                      type: string
                      format: date-time
                      description: date when this site revision was last updated successfully (last time a job for that site revision completed successfully)
                    active:
                      type: boolean
                      description: indicates if this site revision is the active one.
                    job:
                      type: object
                      required:
                      - id
                      description: Reference to the job that modified this site revision most recently
                      properties:
                        id:
                          type: string
                          maxLength: 64
                required:
                - state
        '400':
          description: Unable to handle the request as it does not match the API definition.
          content:
            application/json:
              schema:
                description: This JSON record represents an error condition.
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      description: This JSON record represents an individual error or warning contained in an error message.
                      type: object
                      properties:
                        code:
                          type: integer
                          description: An error code defined by the publishing service.
                        message:
                          type: string
                          description: A message describing what went wrong.
                        description:
                          type: string
                          description: Further explanation of the error condition and potential next steps to resolve the problem.
                        more_info:
                          type: string
                          description: A URL pointing to a web site that provides more information on the given error condition.
                        level:
                          type: string
                          enum:
                          - ERROR
                          - WARNING
                          description: The severity level of the message. Default is error.
                        parameters:
                          type: object
                          description: Additional properties reflecting the dynamic parts of the error condition.
                        cause:
                          type: object
                          description: This property can be used to transport causing error message records produced by a down stream service calls.
                        locale:
                          type: string
                          description: This property represents the locale of the text contained in properties 'message', and 'description'. This property is mandatory if message and description contain translated text.
                      required:
                      - code
                      - message
                  requestId:
                    type: string
                    description: The ID of the failing request.
                  service:
                    type: string
                    description: The name of the service serving the error message.
                required:
                - errors
                - requestId
        '429':
          description: Too Many Requests, the server has reached a limit, the request must be sent again at a later time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Publishing
      summary: Update the default site revision
      description: 'Use the /site-revisions/default endpoint to update the values of properties ''autoPublishEnabled'', ''name'' and ''description'' by replacing them with the ones in request body. Please note: Modifications to the ''autoPublishEnabled'' flag are not picked up by WCH immediately but with a time lag of up to 30 seconds<br />User roles: admin, manager'
