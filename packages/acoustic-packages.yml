note: >-
  Every first-party Acoustic client library found on a public registry is for
  Acoustic Content (the headless CMS). Acoustic Campaign, Acoustic Connect and
  Acoustic Experience Analytics ship no public SDK. The currency signal is stark:
  the newest first-party release on npm is wchtools 4.5.6 from 2021-03-17, and the
  @acoustic-content-sdk/* family last published 2020-03-26 — while the Acoustic
  Content API contract itself is still being republished (spec version 1.0.142,
  reference pages updated 2026-04-08). The published SDKs trail the API they wrap by
  roughly five years.
