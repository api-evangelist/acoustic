generated: '2026-08-13'
method: searched
source: https://developer.goacoustic.com/acoustic-personalization/docs/library-overview
docs:
- https://developer.goacoustic.com/acoustic-personalization/docs/configure-library
- https://developer.goacoustic.com/acoustic-personalization/docs/content-rendering-display-the-personalized-content
